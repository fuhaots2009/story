<style>
/* ============ 视觉规范 ============
   基础：设计文稿 2.9（系统字体/行高 1.9/统计每行一条……）
   用户修订 2026-08-16：
   - 白色背景版本（近白暖色底），正文深暖灰，强调金色，数字金色大字
   - 整体为「年度总结」互动式：开场信 → 统计逐屏 → 「第一次」问答流
   - 点击/滑动/键盘推进；JS 禁用时场景堆叠显示 + noscript 提示
   - 内容宽度 1080px，字号放大，撑满屏幕 */
:root{
  --bg:#12102b;
  --bg-deep:#0c0a1e;
  --ink:#f4efe6;
  --ink-soft:#b6aec8;
  --accent:#f7d794;
  --accent-2:#f0a86e;
  --bubble-me:#3f3128;
  --bubble-you:#1d1a33;
  --line:#343054;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:linear-gradient(180deg,#1a1440 0%,#12102b 45%,var(--bg-deep) 100%)}
body{
  margin:0;
  background:transparent;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  font-size:18px;
  line-height:1.9;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
::selection{background:rgba(247,215,148,.35)}

/* ============ 年度总结场景流 ============ */
#scenes{max-width:1080px;margin:0 auto}
.scene{
  min-height:100vh;
  min-height:100svh;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;
  padding:90px 24px 130px;
  position:relative;
}
/* 流程模式（JS 启用）：一次只显示当前场景；JS 禁用时全部堆叠可见 */
.flow-mode .scene{display:none}
.flow-mode .scene.current{display:flex;animation:sceneIn .6s ease}
.flow-mode .scene-stat.current{animation:none}
#scenes.flow-mode ~ footer{display:none}
/* 单屏专属背景（暂未使用，保留备用） */
.scene-has-bg::before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(rgba(12,10,30,.30),rgba(12,10,30,.55)),var(--scene-bg,transparent) center/cover no-repeat;
}
/* 流程期间锁定：相册与页脚在走完全部场景前不显示（类名由 JS 添加/移除） */
.flow-locked{display:none}
@keyframes sceneIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.scene-line{
  width:44px;height:1px;margin-bottom:34px;
  background:linear-gradient(90deg,var(--accent-2),var(--accent));
}
.scene-letter{margin:0;font-size:22px;letter-spacing:.02em;max-width:820px;font-weight:500;white-space:pre-line}
.scene-letter-date{margin-top:28px;font-size:14px;color:var(--ink-soft);letter-spacing:.3em;text-indent:.3em}

/* 开场信封：第一屏先显示信封，点击后打开，再展示原开场白 */
.scene-intro{
  width:100vw;
  max-width:none;
  margin-left:calc(50% - 50vw);
  height:100vh;
  height:100svh;
  min-height:100vh;
  min-height:100svh;
  justify-content:flex-start;
  padding:0 24px;
  overflow-x:hidden;
}
.scene-intro.letter-ready{justify-content:center}
.scene-intro .scene-page{bottom:24px}
.scene-intro:not(.assets-ready) .scene-page{display:none}
.scene-intro::before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%,rgba(247,215,148,.16),rgba(247,215,148,.06) 28%,transparent 56%);
}
.qixi-bg-art{
  position:absolute;z-index:0;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  object-position:center;
  pointer-events:none;
  opacity:1;
  filter:saturate(1.03) brightness(1.02) contrast(1.01);
}
.envelope-stage{
  position:relative;
  z-index:1;
  width:min(450px,64vw);
  aspect-ratio:1.42;
  margin:clamp(315px,42vh,380px) auto 28px;
  perspective:1200px;
  transform-style:preserve-3d;
  opacity:0;
  transform:translateY(28px);
  animation:envelopeEnter .8s cubic-bezier(.2,.82,.2,1) forwards,envelopeFloat 4.8s ease-in-out .9s infinite;
}
.scene-intro:not(.assets-ready) .envelope-stage{
  display:none;
}
.envelope-stage[hidden]{display:none}
.envelope{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;
  filter:drop-shadow(0 34px 52px rgba(0,0,0,.48));
}
.envelope-back{
  position:absolute;inset:0;z-index:1;border-radius:10px;
  background:
    linear-gradient(90deg,rgba(255,236,190,.30),transparent 18%,rgba(107,54,45,.08) 100%),
    radial-gradient(circle at 22% 16%,rgba(255,255,255,.22),transparent 24%),
    url("assets/img/vintage-envelope-surface.webp?v=20260819b") center/cover no-repeat;
  box-shadow:
    0 0 0 1px rgba(255,236,204,.28) inset,
    0 0 0 3px rgba(132,70,54,.07) inset,
    0 -12px 24px rgba(113,50,46,.11) inset;
}
.envelope-paper{
  position:absolute;left:32%;right:32%;top:15%;height:76%;z-index:2;
  border-radius:5px;
  background:
    linear-gradient(180deg,rgba(255,249,231,.10),rgba(130,79,42,.06)),
    url("assets/img/vintage-letter-paper.webp?v=20260819e") center/100% 100% no-repeat;
  box-shadow:0 14px 28px rgba(67,37,25,.25),0 0 0 1px rgba(142,91,56,.10) inset;
  transform:translateY(8%) scale(.78);
  transform-origin:50% 100%;
}
.envelope-front{
  position:absolute;inset:0;z-index:3;border-radius:10px;overflow:hidden;
  transform:translateZ(2px);
  box-shadow:0 1px 0 rgba(255,245,224,.24) inset;
}
.envelope-front::before,
.envelope-front::after{content:"";position:absolute;inset:0}
.envelope-front::before{
  clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);
  background:
    linear-gradient(135deg,transparent 48.8%,rgba(255,238,198,.58) 49.2%,rgba(255,238,198,.20) 50.2%,transparent 50.8%),
    linear-gradient(45deg,transparent 48.8%,rgba(116,59,49,.18) 49.2%,rgba(255,232,183,.25) 50.2%,transparent 50.8%),
    linear-gradient(110deg,rgba(255,255,255,.16),transparent 30%,rgba(98,51,43,.08) 82%,transparent 100%),
    url("assets/img/vintage-envelope-surface.webp?v=20260819b") center/cover no-repeat;
}
.envelope-front::after{
  clip-path:polygon(0 100%,50% 46%,100% 100%);
  background:
    linear-gradient(180deg,transparent 0%,rgba(255,234,194,.24) 47%,rgba(112,55,47,.13) 48.5%,transparent 52%),
    radial-gradient(circle at 50% 0%,rgba(255,237,199,.20),transparent 34%),
    linear-gradient(90deg,rgba(255,255,255,.16),transparent 44%,rgba(92,47,41,.08)),
    url("assets/img/vintage-envelope-surface.webp?v=20260819b") center/cover no-repeat;
}
.envelope-front .envelope-edge{
  position:absolute;z-index:4;left:5%;right:5%;bottom:8%;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,235,190,.70),transparent);
  box-shadow:
    0 -74px 0 rgba(255,235,190,.14),
    0 -132px 0 rgba(125,58,50,.055);
}
.envelope-stamp{
  position:absolute;right:7%;top:12%;
  width:78px;height:58px;border-radius:6px;
  background:
    radial-gradient(circle at 18% 18%,rgba(255,255,255,.42),transparent 18%),
    repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 2px,transparent 2px 7px),
    linear-gradient(135deg,#7fd1e8 0%,#6aa4df 48%,#d17bb8 100%);
  border:2px solid rgba(255,242,203,.82);
  box-shadow:0 8px 18px rgba(75,42,62,.20),0 0 0 1px rgba(83,52,74,.14) inset;
  transform:rotate(6deg);
}
.envelope-stamp::before{
  content:"";position:absolute;inset:7px;border:1px dashed rgba(255,249,226,.75);border-radius:3px;
}
.envelope-stamp::after{
  content:"❤";position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);
  color:#fff7e8;font-size:25px;text-shadow:0 2px 5px rgba(76,40,64,.28);
}
.envelope-ribbon{
  position:absolute;left:7%;top:14%;
  width:128px;height:18px;border-radius:999px;
  background:linear-gradient(90deg,#7bd8c1,#f7d794 38%,#f49aa1 72%,#b79ae8);
  box-shadow:0 8px 18px rgba(72,42,74,.18),0 1px 0 rgba(255,255,255,.55) inset;
  opacity:.82;
  transform:rotate(-12deg);
}
.envelope-ribbon::after{
  content:"";position:absolute;right:-18px;top:2px;
  border-left:22px solid #b79ae8;
  border-top:7px solid transparent;
  border-bottom:7px solid transparent;
}
.envelope-star{
  position:absolute;width:17px;height:17px;
  background:#fff1b8;
  clip-path:polygon(50% 0,60% 38%,100% 50%,60% 62%,50% 100%,40% 62%,0 50%,40% 38%);
  filter:drop-shadow(0 0 8px rgba(255,226,145,.72));
}
.envelope-star.s1{left:21%;top:34%;transform:rotate(10deg) scale(1.05)}
.envelope-star.s2{right:21%;top:48%;transform:rotate(-18deg) scale(.75);background:#dff7ff}
.envelope-star.s3{left:70%;top:25%;transform:rotate(22deg) scale(.65);background:#ffd7df}
.envelope-flower{
  position:absolute;left:14%;bottom:18%;width:50px;height:50px;border-radius:50%;
  background:
    radial-gradient(circle,#f9d36d 0 18%,transparent 19%),
    radial-gradient(circle at 50% 8%,#f49aa1 0 18%,transparent 19%),
    radial-gradient(circle at 88% 50%,#f49aa1 0 18%,transparent 19%),
    radial-gradient(circle at 50% 92%,#f49aa1 0 18%,transparent 19%),
    radial-gradient(circle at 12% 50%,#f49aa1 0 18%,transparent 19%);
  filter:drop-shadow(0 7px 10px rgba(95,45,62,.20));
  opacity:.82;
  transform:rotate(-9deg);
}
.envelope-lid{
  position:absolute;left:0;right:0;top:0;height:58%;z-index:4;
  transform-origin:50% 0;
  transform:rotateX(0deg);
  transform-style:preserve-3d;
  backface-visibility:visible;
}
.envelope-lid::before{
  content:"";position:absolute;inset:0;
  clip-path:polygon(0 0,100% 0,50% 100%);
  border-radius:10px 10px 0 0;
  background:
    linear-gradient(135deg,transparent 49%,rgba(255,238,202,.50) 49.4%,transparent 50.5%),
    linear-gradient(225deg,transparent 49%,rgba(110,57,48,.14) 49.4%,transparent 50.5%),
    radial-gradient(circle at 50% 4%,rgba(255,255,255,.26),transparent 28%),
    linear-gradient(180deg,rgba(255,255,255,.22),transparent 36%),
    url("assets/img/vintage-envelope-surface.webp?v=20260819b") center top/100% 174% no-repeat;
  box-shadow:0 1px 0 rgba(255,245,224,.30) inset;
}
.envelope-lid::after{
  content:"";position:absolute;left:4%;right:4%;top:0;height:1px;
  background:rgba(255,244,219,.46);
}
.envelope-inscription{
  position:absolute;z-index:6;left:50%;top:57%;
  transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;
  min-width:64px;height:156px;
  padding:15px 10px 13px;
  border:1px solid rgba(126,54,47,.28);
  border-radius:5px;
  background:
    radial-gradient(circle at 35% 9%,rgba(255,255,255,.50),transparent 24%),
    linear-gradient(90deg,rgba(255,255,255,.34),transparent 30%,rgba(139,77,52,.045)),
    repeating-linear-gradient(0deg,rgba(125,72,42,.04) 0 1px,transparent 1px 7px),
    linear-gradient(180deg,#fff9ea 0%,#f2d8b0 100%);
  color:#713229;
  font-family:"STKaiti","Kaiti SC","KaiTi","Songti SC","Noto Serif SC",serif;
  font-size:24px;
  font-weight:700;
  line-height:1.1;
  letter-spacing:.18em;
  writing-mode:vertical-rl;
  text-orientation:upright;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  box-shadow:0 12px 24px rgba(94,42,38,.24),0 0 0 1px rgba(255,255,255,.42) inset;
  transition:transform .25s ease,filter .25s ease,box-shadow .25s ease;
}
.envelope-inscription span{position:relative;z-index:2}
.envelope-inscription .wax-mark{
  position:absolute;z-index:1;left:50%;top:50%;
  width:52px;height:52px;border-radius:50%;
  transform:translate(-50%,-50%);
  background:
    radial-gradient(circle at 34% 28%,rgba(255,236,205,.35),transparent 24%),
    radial-gradient(circle at 50% 50%,rgba(154,56,48,.32),rgba(123,43,39,.18) 62%,transparent 66%);
  box-shadow:0 3px 10px rgba(92,36,33,.16) inset,0 0 0 1px rgba(128,48,42,.12);
}
.envelope-inscription:hover{
  transform:translate(-50%,-52%);
  filter:brightness(1.04);
  box-shadow:0 16px 30px rgba(94,42,38,.30),0 0 0 1px rgba(255,255,255,.48) inset;
}
.envelope-inscription:active{transform:translate(-50%,-50%) scale(.98)}
.envelope-inscription:disabled{
  cursor:wait;
  opacity:.70;
  filter:saturate(.82) brightness(.96);
  box-shadow:0 10px 22px rgba(94,42,38,.18),0 0 0 1px rgba(255,255,255,.34) inset;
}
.envelope-inscription:disabled:hover{transform:translate(-50%,-50%)}
.envelope-inscription:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:6px;
}
.envelope-inscription::before,
.envelope-inscription::after{
  content:"";position:absolute;left:9px;right:9px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(126,55,48,.38),transparent);
}
.envelope-inscription::before{top:8px}
.envelope-inscription::after{bottom:8px}
.intro-letter-wrap{
  display:none;
  position:relative;
  z-index:2;
  width:100%;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  animation:letterReveal .28s ease both;
}
.intro-letter-paper{
  width:min(860px,82vw);
  max-height:min(820px,84svh);
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:clamp(82px,8vh,118px) clamp(72px,7vw,112px) clamp(116px,13vh,150px);
  background:url("assets/img/vintage-letter-paper.webp?v=20260819e") center top/100% 122% no-repeat;
  color:#633b2f;
  filter:drop-shadow(0 26px 48px rgba(20,12,26,.36));
  scrollbar-width:thin;
  scrollbar-color:rgba(154,86,47,.34) transparent;
}
.intro-letter-paper::-webkit-scrollbar{
  width:8px;
}
.intro-letter-paper::-webkit-scrollbar-thumb{
  border-radius:999px;
  background:rgba(154,86,47,.28);
}
.intro-letter-paper .scene-line{
  width:54px;
  margin:0 0 28px;
  background:linear-gradient(90deg,transparent,rgba(151,89,51,.78),transparent);
}
.intro-letter-paper .scene-letter{
  max-width:100%;
  font-family:"STKaiti","Kaiti SC","KaiTi","FangSong","STFangsong","Noto Serif SC",serif;
  font-size:20px;
  line-height:1.92;
  font-weight:600;
  color:#5e372d;
  text-align:left;
  text-shadow:0 1px 0 rgba(255,250,232,.52);
}
.intro-letter-paper .scene-letter-date{
  margin-top:26px;
  color:rgba(96,55,43,.66);
  font-family:"Cormorant Garamond","Times New Roman",serif;
  letter-spacing:.18em;
  text-indent:.18em;
}
.intro-letter-paper .intro-continue{
  margin-top:28px;
  padding:11px 34px;
  border:1px solid rgba(154,86,47,.36);
  background:linear-gradient(180deg,rgba(255,248,225,.88),rgba(231,190,135,.72));
  color:#6c372c;
  box-shadow:0 8px 18px rgba(96,47,35,.16),0 0 0 1px rgba(255,255,255,.36) inset;
}
.intro-loader{
  position:absolute;
  left:50%;
  top:50%;
  z-index:2;
  width:min(380px,64vw);
  margin:0;
  color:rgba(255,248,225,.88);
  text-align:center;
  text-shadow:0 2px 12px rgba(35,19,36,.35);
  opacity:1;
  transform:translate(-50%,-50%);
  transition:opacity .45s ease,transform .45s ease;
}
.intro-loader-track{
  width:100%;
  height:8px;
  border-radius:999px;
  overflow:hidden;
  background:rgba(255,248,225,.26);
  box-shadow:0 1px 0 rgba(255,255,255,.30),0 8px 22px rgba(28,18,43,.22),0 0 0 1px rgba(255,248,225,.16) inset;
}
.intro-loader-fill{
  display:block;
  width:100%;
  height:100%;
  border-radius:inherit;
  transform:scaleX(var(--intro-load,0));
  transform-origin:left center;
  background:linear-gradient(90deg,#f6aeb9,#f7d794,#8ddfd0);
  box-shadow:0 0 18px rgba(247,215,148,.50);
  transition:transform .24s ease;
}
.intro-loader-text{
  margin-top:10px;
  font-size:13px;
  letter-spacing:.14em;
  text-indent:.14em;
}
.scene-intro.assets-ready .intro-loader{
  opacity:0;
  transform:translate(-50%,-58%);
  pointer-events:none;
}
.scene-intro.letter-ready .intro-letter-wrap{display:flex}
.scene-intro.letter-ready .scene-line{animation:sceneIn .7s ease both}
.intro-continue{margin-top:44px}
.scene-intro.envelope-opening .envelope-inscription{pointer-events:none;animation:inscriptionFade .45s ease forwards}
.scene-intro.envelope-opening .envelope-lid{animation:openLid .62s cubic-bezier(.2,.72,.18,1) .12s forwards}
.scene-intro.envelope-opening .envelope-paper{animation:liftPaper .86s cubic-bezier(.2,.78,.18,1) .66s forwards}
.scene-intro.envelope-opening .envelope-stage{animation:envelopeExit 2.4s ease forwards}
@keyframes envelopeEnter{from{opacity:0;transform:translateY(34px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes envelopeFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.008)}}
@keyframes openLid{
  0%{transform:rotateX(0deg);z-index:4}
  70%{transform:rotateX(-142deg);z-index:4}
  100%{transform:rotateX(-176deg);z-index:1}
}
@keyframes liftPaper{
  0%{transform:translateY(8%) scale(.78)}
  72%{transform:translateY(-64%) scale(.87)}
  100%{transform:translateY(-80%) scale(.90)}
}
@keyframes envelopeExit{
  0%,66%{opacity:1;filter:none;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(24px) scale(.96);filter:blur(4px)}
}
@keyframes inscriptionFade{to{opacity:0;transform:translate(-50%,-50%) scale(.94)}}
@keyframes letterReveal{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* 统计场景：金色大数字 + 小号文字（强区分）+ 一句感慨 */
.scene-stat{
  width:100vw;
  max-width:none;
  margin-left:calc(50% - 50vw);
  overflow:hidden;
  background-image:linear-gradient(rgba(10,9,24,.18),rgba(10,9,24,.42)),url("assets/img/bg.jpg");
  background-size:cover;
  background-position:center;
  --stat-value-a:#f7d794;
  --stat-value-b:#f0a86e;
  --stat-value-c:#c05a4b;
  --stat-glow:rgba(247,215,148,.28);
  --stat-label:#d3cde0;
  --stat-note:#b6aec8;
  --stat-copy-x:0px;
  --stat-copy-y:0px;
  --stat-copy-w:min(620px,58vw);
  --stat-copy-align:center;
  --stat-copy-items:center;
}
.scene-stat > :not(.stat-art){position:relative;z-index:2}
.stat-copy{
  width:var(--stat-copy-w);
  max-width:calc(100vw - 96px);
  text-align:var(--stat-copy-align);
  display:flex;
  flex-direction:column;
  align-items:var(--stat-copy-items);
  transform:translate(var(--stat-copy-x),var(--stat-copy-y));
}
.scene-kicker{font-size:14px;letter-spacing:.34em;text-indent:.34em;color:var(--ink-soft);font-weight:500}
.scene-kicker .kicker-em{font-size:22px;font-weight:700;letter-spacing:.1em;margin-right:4px}
.scene-value{
  font-family:"Cormorant Garamond","Georgia","STSong","Songti SC",serif;
  font-size:94px;font-weight:700;line-height:1.2;margin:18px 0 10px;
  background:linear-gradient(180deg,var(--stat-value-a) 0%,var(--stat-value-b) 56%,var(--stat-value-c) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 14px var(--stat-glow));
}
.scene-label{font-size:18px;color:var(--stat-label);letter-spacing:.16em;text-indent:.16em;font-weight:600}
.scene-detail{margin-top:8px;font-size:14px;color:var(--stat-note);letter-spacing:.06em}
/* 文字型数值（如「哈哈」·「自己」·「回来」）小一号，保证一行放下 */
.scene-value.words{
  font-family:"STKaiti","Kaiti SC","KaiTi","Songti SC","Noto Serif SC",serif;

/* 感慨里的数字（如 13 本书）放大突出 */
.scene-stat .scene-note .note-num{
  font-size:28px;font-weight:700;margin:0 3px;
  background:linear-gradient(180deg,var(--stat-value-a),var(--stat-value-c));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.scene-stat .scene-note{position:relative;margin:32px auto 0;font-size:16.5px;color:var(--stat-note);line-height:2;max-width:600px}
.stat-copy .scene-note{margin-left:0;margin-right:0}
.scene-stat .scene-note::before{content:"";display:block;width:26px;height:1px;margin:0 auto 18px;background:linear-gradient(90deg,var(--stat-value-b),var(--stat-value-a));opacity:.9}
.stat-art{
  position:absolute;
  z-index:0;
  width:min(340px,35vw);
  height:auto;
  pointer-events:none;
  opacity:.86;
  filter:drop-shadow(0 22px 34px rgba(8,6,18,.34)) drop-shadow(0 0 26px var(--stat-glow));
  transform-origin:center;
  animation:statArtFloat 7s ease-in-out infinite;
}
.stat-art--right{right:-18px;top:50%;transform:translateY(-48%) rotate(3deg)}
.stat-art--left{left:-18px;top:50%;transform:translateY(-48%) rotate(-3deg)}
.stat-art--bottom-right{right:2px;bottom:86px;transform:rotate(2deg)}
.stat-art--bottom-left{left:2px;bottom:86px;transform:rotate(-2deg)}
.stat-art--hero{
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:1;
  filter:saturate(1.06) brightness(1.06) contrast(1.01);
  transform:none;
  animation:none;
  transition:opacity .28s ease;
}
.stat-art--hero:not(.is-loaded){
  opacity:0;
}
.scene-stat:has(.stat-art--hero){
  background-image:var(--stat-hero-art),url("assets/img/bg.jpg");
  background-size:cover,cover;
  background-position:center,center;
}

/* 问答场景：先只有问题 */
.scene-question{font-size:36px;font-weight:500;line-height:1.75;letter-spacing:.05em;max-width:780px;margin:0}

/* 答案：点击后才 reveal */
.scene-answer{display:none;margin-top:48px;width:100%;max-width:640px}
.scene-answer.revealed{display:block;animation:sceneIn .8s ease}
.scene-answer-date{font-size:14px;color:var(--ink-soft);letter-spacing:.12em}
.scene-answer-caption{margin:6px 0 22px;font-size:20px;font-weight:500}
.scene-answer .chat{text-align:left}
.scene-answer .scene-note{margin:26px auto 0;font-size:16.5px;color:var(--ink-soft);max-width:560px}
.scene-answer img{display:block;margin:0 auto;max-width:420px;width:100%;height:auto;border-radius:12px;margin-top:26px}

/* 底部提示小字（点屏幕 / 左右滑动 / 键盘） */
.scene-hint{
  position:absolute;bottom:66px;left:50%;transform:translateX(-50%);
  margin:0;font-size:14px;color:var(--ink-soft);
  letter-spacing:.26em;text-indent:.26em;white-space:nowrap;pointer-events:none;
}

/* 问答屏的揭晓按钮（渐变药丸，仅问答屏使用；揭晓后隐藏） */
.scene-btn{
  margin-top:52px;padding:13px 44px;border-radius:999px;border:none;
  background:linear-gradient(135deg,var(--accent-2),var(--accent));
  color:#fffdf8;font-size:15px;font-weight:500;letter-spacing:.28em;text-indent:.28em;cursor:pointer;
  box-shadow:0 6px 22px rgba(201,131,50,.35), 0 2px 8px rgba(0,0,0,.12);
  transition:transform .25s,box-shadow .25s,filter .25s;
}
.scene-btn:hover{transform:translateY(-2px);filter:brightness(1.05);box-shadow:0 12px 30px rgba(201,131,50,.42), 0 4px 12px rgba(0,0,0,.15)}
.scene-btn:active{transform:translateY(0);filter:brightness(.97)}
.scene-btn:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

/* 候选 id 徽标（挑选期参考，最终上线前移除） */
.scene-id{display:inline-block;margin-top:26px;padding:3px 14px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--ink-soft);letter-spacing:.08em}

/* ============ 心路历程（阶段页 + 合页时间轴） ============ */
.scene-timeline{
  width:100vw;max-width:none;margin-left:calc(50% - 50vw);
  height:100vh;height:100svh;
  justify-content:flex-start;padding:56px 24px 0;text-align:left;
  overflow:hidden;overscroll-behavior:contain;
  background:
    url("assets/scene-art/premium/timeline-summary-bg.webp?v=20260819b") center/cover no-repeat,
    url("assets/img/bg.jpg") center/cover no-repeat;
}
.scene-timeline::before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    linear-gradient(90deg,rgba(255,248,232,.02) 0%,rgba(255,248,232,.20) 33%,rgba(255,248,232,.50) 50%,rgba(255,248,232,.20) 67%,rgba(255,248,232,.02) 100%),
    radial-gradient(ellipse at 50% 18%,rgba(255,251,236,.48),rgba(255,251,236,.16) 34%,transparent 64%),
    linear-gradient(180deg,rgba(255,255,255,.04),rgba(26,20,64,.14));
}
.scene-timeline > *{position:relative;z-index:1}
.scene-timeline .scene-kicker{
  text-align:center;width:100%;
  color:rgba(82,68,122,.82);
  text-shadow:0 1px 0 rgba(255,255,255,.68),0 8px 18px rgba(70,55,105,.12);
}
/* 阶段页 */
.scene-stage{
  width:100vw;max-width:none;margin-left:calc(50% - 50vw);

  height:100vh;

  background-position:center,center;

  background:
    linear-gradient(90deg,rgba(255,248,232,.02) 0%,rgba(255,248,232,.20) 33%,rgba(255,248,232,.54) 50%,rgba(255,248,232,.20) 67%,rgba(255,248,232,.02) 100%),
    radial-gradient(ellipse at 50% 18%,rgba(255,251,236,.56),rgba(255,251,236,.18) 34%,transparent 64%),

}
.scene-stage > *{position:relative;z-index:1}
.scene-stage .scene-kicker{text-align:center;width:100%}
.stage-kicker{font-size:18px;letter-spacing:.4em;text-indent:.4em}

.scene-stat .rv-3{animation-delay:.65s}

@keyframes rvIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

section{max-width:1080px;margin:0 auto;padding:120px 24px 0}
.section-head{text-align:center;margin-bottom:56px}
.section-head .en{display:block;font-size:13px;letter-spacing:.44em;text-indent:.44em;color:var(--accent);text-transform:uppercase;margin-bottom:16px}

  content:"";display:block;width:44px;height:1px;margin:20px auto 0;

.chat-row.you{justify-content:flex-start}

.bubble{

  font-size:17px;line-height:1.75;word-break:break-word;

}
.bubble.me{

}

/* 时间轴详情里的旁白 */
.tl-card .scene-note{border-left:2px solid var(--accent);padding-left:12px;color:var(--ink-soft);text-align:left}

/* 开场屏的临时跳转链接 */
.jump-link{margin-top:22px;background:none;border:none;color:var(--ink-soft);font-size:14px;letter-spacing:.12em;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.jump-link:hover{color:var(--accent)}

/* ---------- 地图 ---------- */
.map-wrap{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#1c1836}
.map-wrap img{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-100%);text-align:center}

.scene-ending{

<script>
"use strict";
(function () {
  function $(id) { return document.getElementById(id); }

  var StorySound = (function () {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    var ctx = null;
    var master = null;
    var timer = null;
    var step = 0;
    var theme = "";
    var muted = false;
    var unlocked = false;
    var reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var themes = {
      soft: {
        interval: 820,
        wave: "sine",
        volume: 0.034,
        notes: [392.00, 493.88, 587.33, 659.25, 587.33, 493.88],
        bass: [196.00, 246.94, 293.66, 246.94]
      },
      story: {
        interval: 640,
        wave: "triangle",
        volume: 0.032,
        notes: [523.25, 659.25, 783.99, 659.25, 587.33, 698.46, 880.00, 698.46],
        bass: [261.63, 329.63, 392.00, 329.63]
      },
      ending: {
        interval: 900,
        wave: "sine",
        volume: 0.038,
        notes: [329.63, 392.00, 493.88, 587.33, 523.25, 493.88, 392.00, 329.63],
        bass: [164.81, 196.00, 246.94, 196.00]
      }
    };

    function ensure() {
      if (!Ctx) return null;
      if (!ctx) {
        ctx = new Ctx();
        master = ctx.createGain();
        master.gain.value = muted ? 0 : 0.85;
        master.connect(ctx.destination);
      }
      if (ctx.state === "suspended") ctx.resume().catch(function () {});
      return ctx;
    }

    function playTone(freq, dur, vol, wave, delay) {
      var ac = ensure();
      if (!ac || muted || !master) return;
      var now = ac.currentTime + (delay || 0);
      var osc = ac.createOscillator();
      var gain = ac.createGain();
      osc.type = wave || "sine";
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0002), now + 0.035);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain);
      gain.connect(master);
      osc.start(now);
      osc.stop(now + dur + 0.04);
    }

    function tick() {
      var t = themes[theme];
      if (!t || muted) return;
      var note = t.notes[step % t.notes.length];
      playTone(note, 0.72, t.volume, t.wave, 0);
      if (step % 2 === 0) playTone(t.bass[(step / 2) % t.bass.length], 1.05, t.volume * 0.42, "sine", 0.02);
      if (step % 4 === 3) playTone(note * 1.5, 0.46, t.volume * 0.34, "triangle", 0.18);
      step++;
    }

    function startLoop() {
      var t = themes[theme];
      if (!t || timer || !unlocked || reducedMotion) return;
      tick();
      timer = window.setInterval(tick, t.interval);
    }

    function stopLoop() {
      if (timer) window.clearInterval(timer);
      timer = null;
    }

    function fireworkBurst(delay, tone) {
      var ac = ensure();
      if (!ac || muted || !master) return;
      var now = ac.currentTime + (delay || 0);
      var buffer = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.42), ac.sampleRate);
      var data = buffer.getChannelData(0);
      for (var i = 0; i < data.length; i++) {
        var fade = 1 - i / data.length;
        data[i] = (Math.random() * 2 - 1) * fade * fade;
      }
      var src = ac.createBufferSource();
      src.buffer = buffer;
      var filter = ac.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.setValueAtTime(1200 + Math.random() * 900, now);
      filter.Q.value = 0.8;
      var gain = ac.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.18, now + 0.018);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.42);
      src.connect(filter);
      filter.connect(gain);
      gain.connect(master);
      src.start(now);
      src.stop(now + 0.44);
      playTone(tone, 0.38, 0.045, "triangle", delay || 0);
      playTone(tone * 1.5, 0.34, 0.032, "sine", (delay || 0) + 0.08);
    }

    return {
      unlock: function () {},
      setTheme: function () {},
      setMuted: function (nextMuted) {
        muted = !!nextMuted;
        return muted;
      },
      toggleMuted: function () {
        return this.setMuted(!muted);
      },
      fruit: function () {},
      fireworks: function () {}

  var MARKER_CHIP = {

  function bubble(msg) {
    var b = document.createElement("div");
    b.className = "bubble " + (msg.who === "me" ? "me" : "you");
    if (msg.img) {
      var im = document.createElement("img");
      im.src = msg.img.src || msg.img;
      im.alt = "";
      im.loading = "lazy";
      b.appendChild(im);
    }
    // 去掉导出格式的「[消息]」前缀（无含义的引用标记）
    var text = (msg.text || "").replace(/^\[消息\]\s*/, "");
    // 标记与链接类消息不再显示：整条是标记/链接就跳过，夹在文字里就剥掉
    if (/^\[(表情|图片|链接|小程序|音乐|文件)\](\s|$)/.test(text)) return null;
    if (text.includes(" | http")) return null;
    text = text.replace(/\[(表情|图片|链接|小程序|音乐|文件)\]/g, "").trim();
    // 其余纯标记消息（[语音]/[视频]/…）渲染成小图标标签
    var mk = /^\[([^\]]+)\]$/.exec(text);
    if (mk && MARKER_CHIP[mk[1]]) {
      var chip = document.createElement("span");
      chip.className = "marker-chip";
      chip.textContent = MARKER_CHIP[mk[1]];
      b.appendChild(chip);
      return b;
    }
    if (text) b.appendChild(document.createTextNode(text));
    return b;
  }

  /** 头像：有 assets/img/avatar-me.jpg / avatar-you.jpg 时用卡通头像，否则显示「我/你」字母圆片 */
  function avatar(who) {

  function chatBlock(chat) {
    var box = document.createElement("div");

      if (!b) return; // 被过滤的标记消息（[表情]/[图片]）整条跳过
      var row = document.createElement("div");
      row.className = "chat-row " + (m.who === "me" ? "me" : "you");

  function loadOpeningLetter(target) {
    var src = (typeof OPENING_LETTER_SRC !== "undefined" && OPENING_LETTER_SRC) ? OPENING_LETTER_SRC : "";
    if (!src || !window.fetch) {
      target.textContent = "开场白加载失败，请检查开场白文档。";
      return;
    }
    fetch(src, { cache: "no-cache" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(function (text) {
        target.textContent = text.trim();
      })
      .catch(function () {
        target.textContent = "开场白加载失败，请检查 " + src + "。";
      });
  }

  /** 数字滚动计数（统计屏的大数字从 0 涨到目标值） */
  function countUp(scene) {
    var v = scene.querySelector(".scene-value[data-count]");
    if (!v) return;
    scene.__countToken = (scene.__countToken || 0) + 1;
    var token = scene.__countToken;
    var target = +v.getAttribute("data-count");
    var prefix = v.getAttribute("data-prefix") || "";
    var suffix = v.getAttribute("data-suffix") || "";
    var dur = 1300, start = null;
    v.textContent = prefix + "0" + suffix;
    function step(t) {
      if (token !== scene.__countToken) return;
      if (start === null) start = t;
      var p = Math.min(1, (t - start) / dur);
      var eased = 1 - Math.pow(1 - p, 3);
      var n = Math.round(target * eased);
      v.textContent = prefix + n.toLocaleString("en-US") + suffix;
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  /** 统计页每次进入都重新播放逐项淡入，避免隐藏页提前播完 */
  function restartStatReveal(scene) {

  function getSelectedStatArt(statId) {
    var registry = window.SCENE_ART_OPTIONS || [];
    var selected = window.SCENE_ART_SELECTED || {};
    var item = null;
    for (var i = 0; i < registry.length; i++) {
      if (registry[i].id === statId) { item = registry[i]; break; }
    }
    if (!item) return null;
    var wanted = selected[statId] || item.selected || "a";
    var opt = null;
    for (var j = 0; j < item.options.length; j++) {
      if (item.options[j].key === wanted) { opt = item.options[j]; break; }
    }
    return { item: item, opt: opt || item.options[0] };
  }

  function collectSelectedStatArtSources() {
    var registry = window.SCENE_ART_OPTIONS || [];
    var sources = [];
    registry.forEach(function (item) {
      var picked = getSelectedStatArt(item.id);
      if (picked && picked.opt && picked.opt.src) sources.push(picked.opt.src);
    });
    return sources;
  }

  function uniqueAssetSources(sources) {
    var seen = {};
    var out = [];
    (sources || []).forEach(function (src) {
      if (!src) return;
      var value = String(src).trim();
      if (!value || /^data:/.test(value)) return;
      var key;
      try { key = new URL(value, location.href).href; }
      catch (e) { key = value; }
      if (seen[key]) return;
      seen[key] = true;
      out.push(value);
    });
    return out;
  }

  function preloadImageAssets(sources, onProgress, onDone) {
    var queue = uniqueAssetSources(sources);
    var total = queue.length;
    var done = 0;
    var active = 0;
    var limit = 5;
    var finished = false;
    function report() {
      if (onProgress) onProgress(done, total);
    }
    function completeOne() {
      done++;
      active--;
      report();
      pump();
    }
    function pump() {
      if (finished) return;
      while (active < limit && queue.length) {
        active++;
        var src = queue.shift();
        var settled = false;
        var timer = window.setTimeout(function () {
          finish();
        }, 18000);
        function finish() {
          if (settled) return;
          settled = true;
          window.clearTimeout(timer);
          completeOne();
        }
        var im = new Image();
        im.decoding = "async";
        im.onload = finish;
        im.onerror = finish;
        im.src = src;
        if (im.complete && im.naturalWidth) finish();
      }
      if (!queue.length && active === 0) {
        finished = true;
        if (onDone) onDone();
      }
    }
    report();
    pump();
  }

    var opt = picked.opt;

    if (!scenes.length) return;
    container.classList.add("flow-mode");
    scenes.forEach(function (s) { addPage(s.el); });

    (function startIntroAssetGate() {
      var selectedStatSources = collectSelectedStatArtSources();
      var commonSources = [
        "assets/img/qixi-bridge-wide.webp?v=20260819b",
        "assets/img/vintage-envelope-surface.webp?v=20260819b",
        "assets/img/vintage-letter-paper.webp?v=20260819e",
        "assets/img/bg.jpg",
        "assets/img/qixi-round-moon.svg",
        "assets/img/chat-cartoon-bg.webp?v=20260819a",
        "assets/img/love-tree-fireworks.webp",
        "assets/img/avatar-me.jpg?v=20260819b",
        "assets/img/avatar-you.jpg?v=20260819b",
        "assets/scene-art/premium/page-19-love-tree-fixed.webp?v=20260820f",
        "assets/scene-art/premium/timeline-summary-bg.webp?v=20260819b",
        "assets/scene-art/premium/ending-story-continues.webp?v=20260819b"
      ];
      var allSources = commonSources.concat(selectedStatSources, STAGE_BACKGROUNDS || []);
      var gateDone = false;
      container.querySelectorAll("img").forEach(function (img) {
        var src = img.currentSrc || img.src;
        if (src) allSources.push(src);
      });
      allSources = uniqueAssetSources(allSources);
      var criticalSources = uniqueAssetSources([
        "assets/img/qixi-round-moon.svg"
      ].concat(selectedStatSources.slice(0, 5)));
      var criticalKeys = {};
      criticalSources.forEach(function (src) {
        try { criticalKeys[new URL(src, location.href).href] = true; }
        catch (e) { criticalKeys[src] = true; }
      });
      var remainingSources = allSources.filter(function (src) {
        var key;
        try { key = new URL(src, location.href).href; }
        catch (e) { key = src; }
        return !criticalKeys[key];
      });
      function updateIntroProgress(done, total) {
        if (gateDone) return;
        var pct = total ? Math.round(done / total * 100) : 100;
        intro.style.setProperty("--intro-load", String(Math.min(1, pct / 100)));
        loaderText.textContent = pct >= 85 ? "加载完成 " + pct + "%" : "正在加载 " + pct + "%";
        introLoader.setAttribute("aria-label", loaderText.textContent);
        if (pct >= 85) finishIntroGate(pct);
      }
      function finishIntroGate(pct) {
        if (gateDone) return;
        gateDone = true;
        var finalPct = pct || 100;
        intro.style.setProperty("--intro-load", String(Math.min(1, finalPct / 100)));
        loaderText.textContent = "加载完成 " + finalPct + "%";
        introLoader.setAttribute("aria-label", loaderText.textContent);
        introScene.assetsReady = true;
        openBtn.disabled = false;
        intro.classList.add("assets-ready");
        window.setTimeout(function () {
          preloadImageAssets(remainingSources, null, null);
        }, 450);
      }
      preloadImageAssets(criticalSources, updateIntroProgress, finishIntroGate);
      window.setTimeout(function () { finishIntroGate(85); }, 2500);
    })();

    // 流程期间锁定：页脚不显示，走完全部场景才解锁
    var footerEl = document.querySelector("footer");
    if (footerEl) footerEl.classList.add("flow-locked");

    // 返回按钮：第 2 屏起出现在左上角
    var backBtn = document.createElement("button");
    backBtn.type = "button";
    backBtn.className = "scene-back";
    backBtn.setAttribute("aria-label", "上一屏");
    backBtn.textContent = "‹";
    backBtn.hidden = true;
    document.body.appendChild(backBtn);

    var current = 0;
    function show(i) {
      current = Math.max(0, Math.min(scenes.length - 1, i));
      scenes.forEach(function (s, k) {
        s.el.classList.toggle("current", k === current);
        setPage(s.el, current, scenes.length);
      });
      var cur = scenes[current];
      if (cur.el.classList.contains("scene-stat")) {
        restartStatReveal(cur.el);
        countUp(cur.el);
      }
      if (cur.el.classList.contains("scene-stage")) {
        var stageList = cur.el.querySelector(".tl-stage-list");
        if (stageList) stageList.scrollTop = 0;
      }
      backBtn.hidden = current === 0;
      window.scrollTo(0, 0); // 换页时回到顶部，避免沿用上一页的滚动位置
    }

    function startIntroOpen(sc) {
      if (!sc || sc.opening || sc.opened) return;
      if (!sc.assetsReady) return;
      sc.opening = true;
      intro.classList.add("envelope-opening");
      openBtn.disabled = true;
      var reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      window.setTimeout(function () {
        sc.opening = false;
        sc.opened = true;
        envelopeStage.hidden = true;
        intro.classList.add("letter-ready");
      }, reducedMotion ? 300 : 2400);
    }

    function advance() {
      if (!container.classList.contains("flow-mode")) return;
      var sc = scenes[current];
      if (sc.terminal) return;
      if (sc.intro) {
        if (sc.opening) return;
        if (!sc.opened) {
          startIntroOpen(sc);
          return;
        }
      }
      if (sc.stage) return; // 阶段页只能返回，不能前进
      // 问答场景：先揭晓答案，再允许推进
      if (sc.ans && !sc.revealed) {
        sc.revealed = true;
        sc.ans.classList.add("revealed");
        if (sc.btn) sc.btn.hidden = true;
        if (sc.hint) sc.hint.hidden = false;
        return;
      }
      // 线性推进跳过阶段页（阶段页只能从目录点进去）
      var nextIdx = current + 1;
      while (nextIdx < scenes.length && scenes[nextIdx].stage) nextIdx++;
      // 合页未解锁时（阶段没全点亮），前进到合页会被送回目录页
      if (nextIdx === combinedIdx && !allStageVisited()) { show(overviewIdx); return; }
      if (current >= scenes.length - 1) {
        // 流程结束：解除 flow-mode，全部场景可自由滚动回看，解锁页脚
        container.classList.remove("flow-mode");
        scenes.forEach(function (x) { if (x.hint) x.hint.hidden = true; });
        backBtn.hidden = true;
        if (footerEl) footerEl.classList.remove("flow-locked");
        return;
      }
      show(nextIdx);
    }

    function goBack() {
      if (current <= 0) return;
      var prevIdx = current - 1;
      while (prevIdx > 0 && scenes[prevIdx].stage) prevIdx--;
      show(prevIdx);
    }

    scenes.forEach(function (s) {
      if (!s.noTap) s.el.addEventListener("click", advance); // 点屏幕任意处推进（时间轴屏除外）
      if (s.btn) s.btn.addEventListener("click", function (e) {
        e.stopPropagation(); // 防止冒泡到场景点击导致连翻
        advance();
      });
    });
    backBtn.addEventListener("click", goBack);
    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowLeft") { goBack(); }
      else if (e.key === "ArrowRight") { advance(); }
    });

    // —— 手势：触控板双指左右滑动 / 触摸屏横向滑动 ——
    // 左滑 = 下一屏，右滑 = 上一屏；纵向滚动不拦截；冷却 500ms 防止一次手势连翻多屏
    var swipeCooldown = 0;
    var wheelAcc = 0;
    window.addEventListener("wheel", function (e) {
      if (!container.classList.contains("flow-mode")) return;
      if (e.target && e.target.closest && e.target.closest(".intro-letter-paper")) return;
      if (Date.now() < swipeCooldown) { wheelAcc = 0; return; }
      var dx = e.deltaX, dy = e.deltaY;
      if (Math.abs(dx) < Math.abs(dy) * 1.5) { wheelAcc = 0; return; } // 垂直滚动为主时不拦截
      if (Math.abs(dx) < 4) return;
      if (wheelAcc !== 0 && dx * wheelAcc < 0) wheelAcc = 0; // 换向重新累计
      wheelAcc += dx;
      if (Math.abs(wheelAcc) > 60) {
        swipeCooldown = Date.now() + 500;
        wheelAcc = 0;
        if (dx > 0) advance(); else goBack();
      }
    }, { passive: true });

    var tx = 0, ty = 0, tracking = false;
    window.addEventListener("touchstart", function (e) {
      if (e.touches.length !== 1) return;
      if (e.target && e.target.closest && e.target.closest(".intro-letter-paper")) { tracking = false; return; }
      tx = e.touches[0].clientX;
      ty = e.touches[0].clientY;
      tracking = true;
    }, { passive: true });
    window.addEventListener("touchmove", function (e) {
      if (!tracking || !container.classList.contains("flow-mode")) return;
      if (Date.now() < swipeCooldown) { tracking = false; return; }
      var dx = e.touches[0].clientX - tx;
      var dy = e.touches[0].clientY - ty;
      if (Math.abs(dy) > 60 && Math.abs(dy) > Math.abs(dx) * 1.5) { tracking = false; return; } // 纵向滑动
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        tracking = false;
        swipeCooldown = Date.now() + 500;
        if (dx < 0) advance(); else goBack();
      }
    }, { passive: true });
    window.addEventListener("touchend", function () { tracking = false; }, { passive: true });

    // 开发辅助：URL 带 #scene=N 直接跳到第 N 屏（截图/逐屏检查用，从 1 开始计）
    var hashJump = 0;
    var hm = /^#scene=(\d+)$/.exec(location.hash);
    if (hm) hashJump = Math.min(Math.max(parseInt(hm[1], 10) - 1, 0), scenes.length - 1);
    show(hashJump);
  }

  /** 相册。必须写入 w/h 属性防跳动；loading="lazy"。 */
  function renderGallery(photos, container) {
    photos.forEach(function (p) {
      var fig = document.createElement("figure");
      var im = document.createElement("img");
      im.src = p.src; im.width = p.w; im.height = p.h; im.alt = p.alt || "";
      im.loading = "lazy";
      fig.appendChild(im);
      if (p.alt) {
        var cap = document.createElement("figcaption");
        cap.textContent = p.alt;
        fig.appendChild(cap);
      }
      if (p.note) {
        var pn = document.createElement("p");
        pn.className = "gallery-note";
        pn.textContent = p.note;
        fig.appendChild(pn);
      }
      container.appendChild(fig);
    });
    observeFadeIn(container.querySelectorAll("figure"));
  }

  /** 滚动淡入。IntersectionObserver 不可用时全部直接设为可见。 */
  function observeFadeIn(nodes) {
    nodes = Array.prototype.slice.call(nodes || []);
    if (!nodes.length) return;
    if (!("IntersectionObserver" in window)) {
      nodes.forEach(function (n) { n.classList.add("visible"); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add("visible"); io.unobserve(en.target); }
      });
    }, { threshold: 0.08 });
    nodes.forEach(function (n) { n.classList.add("fade-in"); io.observe(n); });
  }

  /** 时间轴详情弹层：点条目后全屏浮层展示该段聊天原文，✕ 或点空白处关闭 */
  function openTimelineDetail(hl) {
    var ov = document.getElementById("tl-overlay");
    if (!ov) {
      ov = document.createElement("div");
      ov.id = "tl-overlay";
      ov.className = "tl-overlay";
      document.body.appendChild(ov);
      ov.addEventListener("click", function () { ov.classList.remove("open"); });
    }
    ov.innerHTML = "";
    var card = document.createElement("div");
    card.className = "tl-card";
    card.addEventListener("click", function (e) { e.stopPropagation(); });
    var close = document.createElement("button");
    close.type = "button";
    close.className = "tl-close";
    close.textContent = "✕";
    close.addEventListener("click", function () { ov.classList.remove("open"); });
    var date = document.createElement("div");
    date.className = "scene-answer-date";
    date.textContent = hl.date;
    var title = document.createElement("h4");
    title.className = "tl-card-title";
    title.textContent = hl.title;
    card.appendChild(close); card.appendChild(date); card.appendChild(title);
    // 左右布局：聊天为主列，旁白在右侧并列（边看聊天边看旁白）
    var body = document.createElement("div");
    body.className = "tl-body";
    var chatWrap = document.createElement("div");
    chatWrap.className = "tl-chat";
    if (hl.messages && hl.messages.length) chatWrap.appendChild(chatBlock(hl.messages));
    body.appendChild(chatWrap);
    if (hl.note) {
      var aside = document.createElement("aside");
      aside.className = "tl-note";
      var nl = document.createElement("div");
      nl.className = "tl-note-label";
      nl.textContent = "旁白";
      var np = document.createElement("p");
      np.textContent = hl.note;
      aside.appendChild(nl); aside.appendChild(np);
      body.appendChild(aside);
    }
    card.appendChild(body);
    ov.appendChild(card);
    ov.classList.add("open");
  }

  /** 音频：恢复使用原来的 bgm.mp3；WebAudio 只保留点果子/烟花短音效。 */
  function setupAudio(audio) {
    var btn = $("mute-btn");
    if (!audio) return;
    audio.volume = 0.58;
    audio.loop = true;
    function onPlay() {
      if (btn) { btn.hidden = false; btn.textContent = "♪"; }
    }
    function tryPlay() {
      audio.play().then(onPlay).catch(function () { /* 浏览器未解锁时静默等待用户交互 */ });
    }
    if (btn) {
      btn.hidden = false;
      btn.textContent = "♪";
      btn.setAttribute("aria-label", "音乐开关");
    }
    audio.addEventListener("error", function () { /* 静默：文件缺失或解码失败不打断页面 */ });
    tryPlay();
    ["click", "touchstart", "scroll"].forEach(function (ev) {
      window.addEventListener(ev, function unlock() {
        if (audio.paused) tryPlay();
        window.removeEventListener(ev, unlock);
      }, { passive: true });
    });
    if (btn) btn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (audio.paused) {
        tryPlay();
      } else {
        audio.pause();
        btn.textContent = "✕";
      }
    });
  }

  /* —— 调用处：每块独立 try/catch，单块失败不影响其余板块 —— */
  function dispatch(id) {
    var container = $(id);
    if (!container) { console.warn(id + " 容器不存在"); return; }
    if (id === "scenes") renderScenes(container);
    if (!container.childElementCount) {
      var sec = container.closest ? container.closest("section") : null;
      if (sec) sec.hidden = true; // 空板块整段隐藏，不留残缺痕迹
    }
  }
  ["scenes"].forEach(function (id) {
    try { dispatch(id); } catch (e) { console.warn(id, e); }
  });

  var audio = $("bgm");
  if (audio) { try { setupAudio(audio); } catch (e) { console.warn("audio", e); } }
})();
</script>
